<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compiler Construction Lab | Interactive Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121826;
      --sidebar-bg: #0d121f;
      --border: #232d42;
      --border-focus: #3b82f6;
      --text: #94a3b8;
      --text-bright: #f8fafc;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      width: 320px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      font-size: 18px;
      color: var(--text-bright);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid var(--primary);
      color: #60a5fa;
      border-radius: 999px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .exp-list {
      list-style: none;
      overflow-y: auto;
      padding: 12px;
      flex-grow: 1;
    }
    .exp-item {
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid transparent;
    }
    .exp-item:hover {
      background-color: rgba(255, 255, 255, 0.04);
      color: var(--text-bright);
    }
    .exp-item.active {
      background-color: rgba(37, 99, 235, 0.15);
      border-color: var(--primary);
      color: #93c5fd;
    }
    .exp-num {
      font-size: 12px;
      font-weight: 700;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      border-radius: 6px;
      color: #94a3b8;
    }
    .exp-item.active .exp-num {
      background: var(--primary);
      color: white;
    }

    /* Main Content */
    .main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: var(--bg);
    }
    .topbar {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
    }
    .topbar-info h2 {
      font-size: 20px;
      color: var(--text-bright);
      font-weight: 700;
    }
    .topbar-info p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .btn-primary {
      background-color: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
    .btn-accent {
      background-color: #059669;
      color: white;
    }
    .btn-accent:hover {
      background-color: #10b981;
    }
    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text-bright);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #475569;
    }

    .content-body {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    .card h3 {
      font-size: 15px;
      color: var(--text-bright);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .card p {
      font-size: 14px;
      line-height: 1.6;
    }
    .code-container {
      position: relative;
      background: #050811;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #0d1322;
      border-bottom: 1px solid var(--border);
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: #64748b;
    }
    pre {
      padding: 16px;
      font-family: 'Fira Code', monospace;
      font-size: 13.5px;
      color: #e2e8f0;
      overflow-x: auto;
      line-height: 1.6;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #059669;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Compiler Lab <span class="badge">7 Exps</span></h1>
    </div>
    <ul class="exp-list" id="expList"></ul>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-info">
        <h2 id="expTitle">Experiment 1</h2>
        <p id="expAim">Aim of the experiment...</p>
      </div>
      <div class="actions">
        <button id="copyBtn" class="btn btn-outline">📋 Copy Code</button>
        <button id="runOnlineGDB" class="btn btn-primary">🚀 Run on OnlineGDB</button>
        <button id="runOneCompiler" class="btn btn-accent">⚡ Run on OneCompiler</button>
      </div>
    </div>

    <div class="content-body">
      <div class="code-container">
        <div class="code-header">
          <span id="codeFileName">filename.cpp</span>
          <span>Clicking 'Run' auto-copies the code to your clipboard</span>
        </div>
        <pre><code id="codeBlock"></code></pre>
      </div>
    </div>
  </main>

  <div id="toast" class="toast">
    ✓ Code copied to clipboard! Opening compiler...
  </div>

  <script>
    const EXPERIMENTS = [
      {
        id: 1,
        title: "Experiment 1: Fibonacci Series in C++",
        aim: "Generate and print Fibonacci series up to n terms.",
        fileName: "fibonacci.cpp",
        gdb: "https://www.onlinegdb.com/online_c++_compiler",
        one: "https://onecompiler.com/cpp",
        code: `#include <iostream>
using namespace std;

int main() {
    int n, a = 0, b = 1, c;

    cout << "Enter number of terms: ";
    cin >> n;

    cout << "Fibonacci series: ";

    for (int i = 1; i <= n; i++) {
        cout << a << " ";

        c = a + b;
        a = b;
        b = c;
    }

    return 0;
}`
      },
      {
        id: 2,
        title: "Experiment 2: Macro Definition Identification in C++",
        aim: "Identify whether an assembly instruction is a Macro Definition.",
        fileName: "macro_definition.cpp",
        gdb: "https://www.onlinegdb.com/online_c++_compiler",
        one: "https://onecompiler.com/cpp",
        code: `#include <iostream>
#include <string>
using namespace std;

int main() {
    string s;

    cout << "Enter assembly instruction: ";
    getline(cin, s);

    if (s.find("MACRO") != string::npos) {
        cout << "It is a macro definition" << endl;
    } else {
        cout << "It is not a macro definition" << endl;
    }

    return 0;
}`
      },
      {
        id: 3,
        title: "Experiment 3: Lexical Analysis of C Source Code",
        aim: "Identify keywords, identifiers, constants, operators, and special symbols.",
        fileName: "lexical_analysis.c",
        gdb: "https://www.onlinegdb.com/online_c_compiler",
        one: "https://onecompiler.com/c",
        code: `#include <stdio.h>
#include <string.h>
#include <ctype.h>

char *keywords[] = {
    "int", "float", "char", "double",
    "if", "else", "for", "while",
    "return", "void", "break", "continue"
};

int isKeyword(char *word) {
    int i;
    for (i = 0; i < 12; i++) {
        if (strcmp(word, keywords[i]) == 0) return 1;
    }
    return 0;
}

int isOperator(char ch) {
    return (ch == '+' || ch == '-' || ch == '*' ||
            ch == '/' || ch == '=' || ch == '<' ||
            ch == '>' || ch == '%');
}

int main() {
    char str[500];
    int i = 0;

    printf("Enter C source code: ");
    fgets(str, sizeof(str), stdin);

    while (str[i] != '\\0') {
        if (isspace(str[i])) { i++; continue; }

        if (isalpha(str[i]) || str[i] == '_') {
            char word[50];
            int j = 0;
            while (isalnum(str[i]) || str[i] == '_') word[j++] = str[i++];
            word[j] = '\\0';
            if (isKeyword(word)) printf("%s -> Keyword\\n", word);
            else printf("%s -> Identifier\\n", word);
        } else if (isdigit(str[i])) {
            char number[50];
            int j = 0;
            while (isdigit(str[i])) number[j++] = str[i++];
            number[j] = '\\0';
            printf("%s -> Constant\\n", number);
        } else if (isOperator(str[i])) {
            printf("%c -> Operator\\n", str[i]);
            i++;
        } else {
            printf("%c -> Special Symbol\\n", str[i]);
            i++;
        }
    }
    return 0;
}`
      },
      {
        id: 4,
        title: "Experiment 4: Construction of a Parse Tree in C",
        aim: "Construct binary parse tree for a = b + c * d with Inorder & Preorder traversals.",
        fileName: "parse_tree.c",
        gdb: "https://www.onlinegdb.com/online_c_compiler",
        one: "https://onecompiler.com/c",
        code: `#include <stdio.h>
#include <stdlib.h>

struct Node {
    char data;
    struct Node *left;
    struct Node *right;
};

struct Node *createNode(char data) {
    struct Node *newNode = (struct Node *)malloc(sizeof(struct Node));
    newNode->data = data;
    newNode->left = NULL;
    newNode->right = NULL;
    return newNode;
}

void inorder(struct Node *root) {
    if (root != NULL) {
        inorder(root->left);
        printf("%c", root->data);
        inorder(root->right);
    }
}

void preorder(struct Node *root) {
    if (root != NULL) {
        printf("%c", root->data);
        preorder(root->left);
        preorder(root->right);
    }
}

int main() {
    struct Node *root;

    root = createNode('=');
    root->left = createNode('a');
    root->right = createNode('+');
    root->right->left = createNode('b');
    root->right->right = createNode('*');
    root->right->right->left = createNode('c');
    root->right->right->right = createNode('d');

    printf("Inorder Traversal: ");
    inorder(root);
    printf("\\n");

    printf("Preorder Traversal: ");
    preorder(root);
    printf("\\n");

    return 0;
}`
      },
      {
        id: 5,
        title: "Experiment 5: Source Code Optimization",
        aim: "Demonstrate operator strength reduction, dead code elimination & loop motion.",
        fileName: "optimization.c",
        gdb: "https://www.onlinegdb.com/online_c_compiler",
        one: "https://onecompiler.com/c",
        code: `#include <stdio.h>
#include <string.h>

int main() {
    char expression[100];

    printf("Enter expression: ");
    fgets(expression, sizeof(expression), stdin);

    if (strstr(expression, "* 2") != NULL) {
        printf("\\nOptimized expression:\\n");
        printf("Replace multiplication by 2 with addition.\\n");
        printf("x = i + i\\n");
    } else {
        printf("\\nNo strength reduction applicable.\\n");
    }

    return 0;
}`
      },
      {
        id: 6,
        title: "Experiment 6: MiniLang High-Level Language",
        aim: "Lexical analysis and basic syntax validation for MiniLang.",
        fileName: "minilang.c",
        gdb: "https://www.onlinegdb.com/online_c_compiler",
        one: "https://onecompiler.com/c",
        code: `#include <stdio.h>
#include <string.h>
#include <ctype.h>

#define MAX 500

char keywords[][10] = { "int", "if", "else", "while" };

int isKeyword(char word[]) {
    for (int i = 0; i < 4; i++) {
        if (strcmp(word, keywords[i]) == 0) return 1;
    }
    return 0;
}

int isDelimiter(char ch) {
    return (ch == '(' || ch == ')' || ch == '{' || ch == '}' || ch == ';');
}

int isOperatorStart(char ch) {
    return (ch == '+' || ch == '-' || ch == '*' || ch == '/' || ch == '%' ||
            ch == '<' || ch == '>' || ch == '=' || ch == '!' || ch == '&' || ch == '|');
}

void lexicalAnalysis(char input[]) {
    int i = 0;
    char token[MAX];
    printf("\\n----- LEXICAL ANALYSIS -----\\n");
    while (input[i] != '\\0') {
        if (isspace(input[i])) { i++; continue; }

        if (isalpha(input[i]) || input[i] == '_') {
            int j = 0;
            while (isalnum(input[i]) || input[i] == '_') token[j++] = input[i++];
            token[j] = '\\0';
            printf("%-15s : %s\\n", token, isKeyword(token) ? "KEYWORD" : "IDENTIFIER");
        } else if (isdigit(input[i])) {
            int j = 0;
            while (isdigit(input[i])) token[j++] = input[i++];
            token[j] = '\\0';
            printf("%-15s : CONSTANT\\n", token);
        } else if (isDelimiter(input[i])) {
            printf("%-15c : DELIMITER\\n", input[i++]);
        } else if (isOperatorStart(input[i])) {
            char op[3] = { input[i], '\\0', '\\0' };
            if ((input[i] == '<' || input[i] == '>' || input[i] == '=' || input[i] == '!') && input[i+1] == '=') {
                op[1] = '='; i += 2;
            } else if ((input[i] == '&' && input[i+1] == '&') || (input[i] == '|' && input[i+1] == '|')) {
                op[1] = input[i]; i += 2;
            } else { i++; }
            printf("%-15s : OPERATOR\\n", op);
        } else {
            printf("%-15c : UNKNOWN SYMBOL\\n", input[i++]);
        }
    }
}

void syntaxCheck(char input[]) {
    int i = 0, braces = 0, parentheses = 0, errors = 0;
    printf("\\n----- SYNTAX CHECK -----\\n");
    while (input[i] != '\\0') {
        if (input[i] == '{') braces++;
        else if (input[i] == '}') { braces--; if (braces < 0) { printf("Error: Unexpected '}'\\n"); errors++; braces = 0; } }
        else if (input[i] == '(') parentheses++;
        else if (input[i] == ')') { parentheses--; if (parentheses < 0) { printf("Error: Unexpected ')'\\n"); errors++; parentheses = 0; } }
        i++;
    }
    if (braces != 0) { printf("Error: Unbalanced braces {}\\n"); errors++; }
    if (parentheses != 0) { printf("Error: Unbalanced parentheses ()\\n"); errors++; }
    if (errors == 0) printf("Syntax structure is valid.\\n");
    else printf("Syntax errors detected.\\n");
}

int main() {
    char input[MAX];
    int pos = 0;
    char ch;
    printf("Enter MiniLang program. Terminate with #:\\n\\n");
    while (pos < MAX - 1 && (ch = getchar()) != '#') input[pos++] = ch;
    input[pos] = '\\0';

    if (pos == 0) { printf("Empty program.\\n"); return 0; }
    lexicalAnalysis(input);
    syntaxCheck(input);
    return 0;
}`
      },
      {
        id: 7,
        title: "Experiment 7: Lexical Analyzer Using LEX / FLEX",
        aim: "Classify tokens using Flex regular expressions.",
        fileName: "lexer.l",
        gdb: "https://www.onlinegdb.com/online_c_compiler",
        one: "https://onecompiler.com/",
        code: `%{
#include <stdio.h>
%}

%option noyywrap

%%
"int"|"float"|"char"|"double"|"if"|"else"|"while"|"for"|"return" {
    printf("%s -> KEYWORD\\n", yytext);
}

[0-9]+ {
    printf("%s -> NUMBER\\n", yytext);
}

[a-zA-Z_][a-zA-Z0-9_]* {
    printf("%s -> IDENTIFIER\\n", yytext);
}

"=="|"!="|"<="|">="|"&&"|"||"|"++"|"--" {
    printf("%s -> OPERATOR\\n", yytext);
}

[+\\-*/%=<>] {
    printf("%s -> OPERATOR\\n", yytext);
}

[{}();,\\[\\]] {
    printf("%s -> SPECIAL SYMBOL\\n", yytext);
}

[ \\t\\n]+ { /* Ignore whitespace */ }

. {
    printf("%s -> UNKNOWN\\n", yytext);
}
%%

int main()
{
    printf("Enter C program (Ctrl+D to finish):\\n");
    yylex();
    return 0;
}`
      }
    ];

    let currentExpIndex = 0;

    const expList = document.getElementById('expList');
    const expTitle = document.getElementById('expTitle');
    const expAim = document.getElementById('expAim');
    const codeFileName = document.getElementById('codeFileName');
    const codeBlock = document.getElementById('codeBlock');
    const copyBtn = document.getElementById('copyBtn');
    const runOnlineGDB = document.getElementById('runOnlineGDB');
    const runOneCompiler = document.getElementById('runOneCompiler');
    const toast = document.getElementById('toast');

    function showToast(message) {
      toast.innerText = message || "✓ Code copied to clipboard!";
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function renderList() {
      expList.innerHTML = '';
      EXPERIMENTS.forEach((exp, idx) => {
        const li = document.createElement('li');
        li.className = 'exp-item' + (idx === currentExpIndex ? ' active' : '');
        li.innerHTML = `
          <div class="exp-num">${exp.id}</div>
          <div>${exp.title.split(':')[1] || exp.title}</div>
        `;
        li.addEventListener('click', () => {
          currentExpIndex = idx;
          renderList();
          renderContent();
        });
        expList.appendChild(li);
      });
    }

    function renderContent() {
      const exp = EXPERIMENTS[currentExpIndex];
      expTitle.innerText = exp.title;
      expAim.innerText = exp.aim;
      codeFileName.innerText = exp.fileName;
      codeBlock.innerText = exp.code;
    }

    function copyCurrentCode() {
      const exp = EXPERIMENTS[currentExpIndex];
      return navigator.clipboard.writeText(exp.code).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = exp.code;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      });
    }

    copyBtn.addEventListener('click', () => {
      copyCurrentCode().then(() => showToast("✓ Code copied to clipboard!"));
    });

    runOnlineGDB.addEventListener('click', () => {
      const exp = EXPERIMENTS[currentExpIndex];
      copyCurrentCode().then(() => {
        showToast("✓ Code copied! Opening OnlineGDB in new tab...");
        window.open(exp.gdb, '_blank');
      });
    });

    runOneCompiler.addEventListener('click', () => {
      const exp = EXPERIMENTS[currentExpIndex];
      copyCurrentCode().then(() => {
        showToast("✓ Code copied! Opening OneCompiler in new tab...");
        window.open(exp.one, '_blank');
      });
    });

    renderList();
    renderContent();
  </script>
</body>
</html>
